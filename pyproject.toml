[project]
name = "movement-project"
version = "0.1.0"
description = "Interpretable movement quality analysis framework"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "black>=24",
    "isort>=5",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py310"
