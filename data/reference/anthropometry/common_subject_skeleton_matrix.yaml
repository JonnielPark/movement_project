common_subject_skeleton_matrix:
  schema_version: '0.1'
  artifact_status: aggregate_engineering_profile_matrix
  source_prior: Aggregate Engineering Skeleton Prior
  source: Size Korea 8th Korean Anthropometric Survey
  source_scope: 2020_3d_full_body_automatic_measurements_only_no_138_to_311
  defaults:
    prior_artifact_path: data/reference/anthropometry/size_korea8_3d_auto_skeleton_prior.yaml
    tolerance_ranges_path: data/reference/anthropometry/size_korea8_3d_auto_stage_a_tolerance_ranges.csv
    segment_constraints_path: data/reference/anthropometry/quasi_rigid_segment_constraints.yaml
    soft_margin_scale: 0.5
    output_model_path_pattern: data/reference/anthropometry/common_subject_skeleton_{sex}_{height_cm}cm.yaml
  selection_policy:
    sex_required: true
    exact_height_cm_preferred: true
    height_bin_used_for_nominal_length_only: true
    height_bin_ratio_override_active: false
    ratio_selection: sex_specific_mean_ratio_to_stature
    metric_coordinate_output: false
    coordinate_rescaling_from_height: false
  height_bins: [{id: <=150cm, label: <=150cm, min_cm: null, max_cm: 150, representative_height_cm: 150}, {id: 151-155cm, label: 151-155cm, min_cm: 151, max_cm: 155,
      representative_height_cm: 153}, {id: 156-160cm, label: 156-160cm, min_cm: 156, max_cm: 160, representative_height_cm: 158}, {id: 161-165cm, label: 161-165cm,
      min_cm: 161, max_cm: 165, representative_height_cm: 163}, {id: 166-170cm, label: 166-170cm, min_cm: 166, max_cm: 170, representative_height_cm: 168}, {id: 171-175cm,
      label: 171-175cm, min_cm: 171, max_cm: 175, representative_height_cm: 173}, {id: 176-180cm, label: 176-180cm, min_cm: 176, max_cm: 180, representative_height_cm: 178},
    {id: 181cm+, label: 181cm+, min_cm: 181, max_cm: null, representative_height_cm: 181}]
  profiles: [{profile_id: male_175cm, sex: male, height_cm: 175, height_bin: 171-175cm, description: Current p01 squat development profile; exact height is used only
        for researcher-readable nominal lengths., output_model_path: data/reference/anthropometry/common_subject_skeleton_male_175cm.yaml}]
  axes:
    sexes: [male, female]
    segments: [shoulder_width, hip_width, torso_shoulder_hip_vertical, trunk_vertical, upper_arm, forearm, thigh, shank, sitting_height, crotch_height, outside_leg_length,
      foot]
    height_bins: [<=150cm, 151-155cm, 156-160cm, 161-165cm, 166-170cm, 171-175cm, 176-180cm, 181cm+]
    ratio_fields: [target_ratio_to_stature, soft_margin_relative, soft_lower_ratio_to_stature, soft_upper_ratio_to_stature, hard_margin_relative, hard_lower_ratio_to_stature,
      hard_upper_ratio_to_stature]
    length_fields: [target_length_cm, soft_lower_length_cm, soft_upper_length_cm, hard_lower_length_cm, hard_upper_length_cm]
  segment_metadata:
    shoulder_width:
      proxy_level: proxy_close
      reference: stature
      formula: m299
      component_items: ['m299:어깨가쪽사이너비']
      notes: Seated shoulder-outside breadth proxy; closer to transverse shoulder landmark distance than shoulder length. Compare m298 as sensitivity.
      range_role: depth_correction_reference
      active_for_depth_correction: true
    hip_width:
      proxy_level: proxy
      reference: stature
      formula: m265
      component_items: ['m265:엉덩이너비']
      notes: Surface hip breadth proxy; can exceed pose-model internal hip-joint distance.
      range_role: depth_correction_reference
      active_for_depth_correction: true
    torso_shoulder_hip_vertical:
      proxy_level: vertical_proxy
      reference: stature
      formula: m145 - m155
      component_items: ['m145:어깨가쪽높이', 'm155:엉덩이높이']
      notes: Standing vertical proxy; not 3D Euclidean shoulder-center to hip-center segment.
      range_role: depth_correction_reference
      active_for_depth_correction: true
    trunk_vertical:
      proxy_level: proxy
      reference: stature
      formula: m192
      component_items: ['m192:몸통수직길이']
      notes: Trunk vertical length proxy; do not collapse with shoulder-hip vertical proxy until validated.
      range_role: review_only_auxiliary_scale_proxy
      active_for_depth_correction: false
    upper_arm:
      proxy_level: proxy_close
      reference: stature
      formula: m189
      component_items: ['m189:위팔길이(어깨가쪽점)']
      notes: Preferred over m188 if MediaPipe shoulder uses lateral shoulder landmark convention.
      range_role: depth_correction_reference
      active_for_depth_correction: true
    forearm:
      proxy_level: derived_proxy
      reference: stature
      formula: m191 - m189
      component_items: ['m191:팔길이(어깨가쪽점)', 'm189:위팔길이(어깨가쪽점)']
      notes: Row-level derivation is discussion-only; aggregate mean difference is used here.
      range_role: depth_correction_reference
      active_for_depth_correction: true
    thigh:
      proxy_level: vertical_proxy
      reference: stature
      formula: m155 - m159
      component_items: ['m155:엉덩이높이', 'm159:무릎높이']
      notes: Primary auto-only proxy for MediaPipe hip-knee. Uses hip height to knee height; vertical-only, not Euclidean 3D segment.
      range_role: depth_correction_reference
      active_for_depth_correction: true
    shank:
      proxy_level: vertical_proxy
      reference: stature
      formula: m159 - m161
      component_items: ['m159:무릎높이', 'm161:가쪽복사높이']
      notes: Vertical knee-to-lateral-malleolus proxy; not ankle joint center segment.
      range_role: depth_correction_reference
      active_for_depth_correction: true
    sitting_height:
      proxy_level: proxy
      reference: stature
      formula: m290
      component_items: ['m290:앉은키']
      notes: Includes head/neck; not torso segment.
      range_role: review_only_auxiliary_scale_proxy
      active_for_depth_correction: false
    crotch_height:
      proxy_level: proxy
      reference: stature
      formula: m156
      component_items: ['m156:샅높이']
      notes: Inseam/crotch-height proxy; useful for lower-limb scale.
      range_role: review_only_auxiliary_scale_proxy
      active_for_depth_correction: false
    outside_leg_length:
      proxy_level: proxy
      reference: stature
      formula: m278
      component_items: ['m278:다리가쪽길이']
      notes: Whole outside leg length; not a single pose segment.
      range_role: review_only_auxiliary_scale_proxy
      active_for_depth_correction: false
    foot:
      proxy_level: not_available
      reference: stature
      formula: not_available
      component_items: []
      notes: Requires 3D foot auto or another foot measurement source; excluded by auto-only scope.
      range_role: disabled_or_unavailable
      active_for_depth_correction: false
