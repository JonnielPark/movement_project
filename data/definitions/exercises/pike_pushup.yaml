exercise_id: pike_pushup
display_name: Pike Push-up
description: Inverted closed-chain upper-body push movement; head descends toward
  the floor between the hands while the hips remain piked.
version: 0.5.2
tags:
- bodyweight
- upper_body
- closed_chain
- bilateral
- strength
classification:
  family: upper_body
  equipment: none
  load_type: bodyweight
  external_load_position: none
  posture_type: inverted_closed_chain
  kinetic_chain: closed_chain
  laterality: bilateral_symmetric
  movement_pattern: push
  primary_plane: sagittal
  secondary_planes:
  - frontal
  complexity: compound
support:
  base_of_support: hands_and_feet
  contact_points:
  - left_hand
  - right_hand
  - left_foot
  - right_foot
  support_surface: floor
  weight_bearing_regions:
  - left_hand
  - right_hand
  - left_foot
  - right_foot
phase_model:
  type: resistance_phase
  expected_ratio:
    eccentric: 0.45
    isometric: 0.1
    concentric: 0.45
joint_actions:
  primary:
  - shoulder_flexion_extension
  - elbow_flexion_extension
  - scapular_stability_proxy
  secondary:
  - trunk_flexion_extension
  - pelvis_anterior_posterior_tilt_proxy
  - hip_flexion_extension
primary_body_regions:
- shoulder
- elbow
- wrist
- trunk
biomechanical_identity:
  expected_com_motion: vertical
  stability_requirement: high
  main_load_regions:
  - shoulder
  - elbow
  - wrist
  - trunk
  primary_constraints:
  - maintain_hand_contact
  - maintain_trunk_alignment
  - maintain_neutral_spine_proxy
  - maintain_head_position
  - maintain_support_symmetry
notes: 'Pike push-up validates upper-body bilateral symmetry under inverted load.

  Shoulder and elbow landmarks frequently self-occlude in the bottom phase;

  sagittal views are strongly preferred. Head landmark (nose, idx 0) is the

  primary descent reference for depth_proxy.

  '
