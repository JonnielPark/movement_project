exercise_id: lunge
version: 0.5.2
presets:
  segmentation: resistance_vertical_hip
  landmark_set: lower_body_hip_knee_ankle
  quality_rules: lower_body_standard
biomechanical_focus:
  expected_com_motion: vertical_and_anterior_posterior
  stability_requirement: high
  main_load_regions:
  - hip
  - knee
  - ankle
  primary_constraints:
  - maintain_foot_contact
  - maintain_trunk_alignment
  - avoid_knee_valgus
  - avoid_excessive_lateral_shift
  - maintain_pelvis_level
compensation_patterns:
- knee_valgus
- asymmetric_knee_flexion
- asymmetric_hip_flexion
- insufficient_rear_hip_extension
- excessive_trunk_flexion
- lateral_trunk_lean
- lateral_pelvic_shift
- pelvis_drop
- unstable_step_width
- heel_lift
- tempo_instability
- phase_timing_asymmetry
feature_domains:
  spatial:
  - range_of_motion
  - role_alignment
  - movement_path
  - alignment
  - depth_proxy
  - support_width
  temporal:
  - tempo
  - rep_duration
  - eccentric_duration
  - concentric_duration
  - timing_ratio
  - left_right_timing_variability
  control:
  - stability
  - compensation
  - com_stability
  - pelvis_stability
  - lateral_shift
  - balance_control
  - joint_tracking_error
  biomechanical_proxy:
  - com_displacement
  - com_velocity_proxy
  - segment_length_normalized_displacement
  - moment_arm_proxy
  - relative_joint_load_proxy
  - compensation_load_shift_proxy
