exercise_id: squat
version: 0.6.0
presets:
  segmentation: resistance_vertical_hip
  landmark_set: lower_body_hip_knee_ankle
  quality_rules: lower_body_standard
biomechanical_focus:
  expected_com_motion: vertical
  stability_requirement: medium
  main_load_regions:
  - hip
  - knee
  - ankle
  primary_constraints:
  - maintain_foot_contact
  - maintain_trunk_alignment
  - avoid_knee_valgus
  - avoid_heel_lift
  - avoid_excessive_lateral_shift
compensation_patterns:
- knee_valgus
- knee_varus
- asymmetric_depth
- excessive_trunk_flexion
- lateral_pelvic_shift
- heel_lift
- pelvis_rotation
- tempo_instability
- foot_external_rotation_proxy
feature_domains:
  spatial:
  - range_of_motion
  - role_alignment
  - movement_path
  - depth_proxy
  - alignment
  temporal:
  - tempo
  - rep_duration
  - eccentric_duration
  - isometric_duration
  - concentric_duration
  - timing_ratio
  - phase_profile
  control:
  - stability
  - compensation
  - com_stability
  - pelvis_stability
  - lateral_shift
  - joint_tracking_error
  biomechanical_proxy:
  - com_displacement
  - segment_length_normalized_displacement
  - moment_arm_proxy
  - relative_joint_load_proxy
  - compensation_load_shift_proxy
quality_rules:
  temporal_tolerance_bands:
    temporal.tempo.rep_duration:
      scoring_mode: acceptable_duration_band
      minimum_duration_s: 1.2
      maximum_duration_s: 3.5
      soft_tolerance_s: 0.3
    temporal.tempo.rep_duration.descent:
      scoring_mode: acceptable_duration_band
      minimum_duration_s: 0.4
      maximum_duration_s: 1.5
      soft_tolerance_s: 0.15
    temporal.tempo.rep_duration.turnaround_hold:
      scoring_mode: acceptable_duration_band
      minimum_duration_s: 0.0
      maximum_duration_s: 0.5
      soft_tolerance_s: 0.1
    temporal.tempo.rep_duration.ascent:
      scoring_mode: acceptable_duration_band
      minimum_duration_s: 0.4
      maximum_duration_s: 1.5
      soft_tolerance_s: 0.15
  temporal_variability_bands:
    temporal.variability.tempo_cv:
      scoring_mode: maximum_sufficient_ceiling
      maximum_cv: 0.05
      soft_tolerance_cv: 0.05
  temporal_phase_profile_bands:
    temporal.phase_profile.duration_ratio.descent_ascent:
      scoring_mode: acceptable_ratio_band
      minimum_ratio: 0.5
      maximum_ratio: 2.0
      soft_tolerance_ratio: 0.25
  range_of_motion_targets:
    spatial.range_of_motion.xy.left_hip_angle:
      scoring_mode: minimum_sufficient_band
      minimum_sufficient_deg: 70.0
      excessive_threshold_deg: 160.0
      soft_tolerance_deg: 10.0
      excessive_penalty_scale: 0.5
      apply_to_phase_suffixes:
      - full_rep
      - descent
      - ascent
    spatial.range_of_motion.xy.right_hip_angle:
      scoring_mode: minimum_sufficient_band
      minimum_sufficient_deg: 70.0
      excessive_threshold_deg: 160.0
      soft_tolerance_deg: 10.0
      excessive_penalty_scale: 0.5
      apply_to_phase_suffixes:
      - full_rep
      - descent
      - ascent
    spatial.range_of_motion.xy.left_knee_angle:
      scoring_mode: minimum_sufficient_band
      minimum_sufficient_deg: 90.0
      excessive_threshold_deg: 160.0
      soft_tolerance_deg: 10.0
      excessive_penalty_scale: 0.5
      apply_to_phase_suffixes:
      - full_rep
      - descent
      - ascent
    spatial.range_of_motion.xy.right_knee_angle:
      scoring_mode: minimum_sufficient_band
      minimum_sufficient_deg: 90.0
      excessive_threshold_deg: 160.0
      soft_tolerance_deg: 10.0
      excessive_penalty_scale: 0.5
      apply_to_phase_suffixes:
      - full_rep
      - descent
      - ascent
    spatial.range_of_motion.xy.left_ankle_angle:
      scoring_mode: minimum_sufficient_band
      minimum_sufficient_deg: 10.0
      excessive_threshold_deg: 60.0
      soft_tolerance_deg: 5.0
      excessive_penalty_scale: 0.5
      apply_to_phase_suffixes:
      - full_rep
      - descent
      - ascent
    spatial.range_of_motion.xy.right_ankle_angle:
      scoring_mode: minimum_sufficient_band
      minimum_sufficient_deg: 10.0
      excessive_threshold_deg: 60.0
      soft_tolerance_deg: 5.0
      excessive_penalty_scale: 0.5
      apply_to_phase_suffixes:
      - full_rep
      - descent
      - ascent
