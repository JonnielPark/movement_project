version: 1.2.0
last_updated: 2026-06-19
coordinate_reference: reference_origin
zone_model: polar_camera_ring
origin:
  label: subject_or_reference_mat_center

default_distance_cm: [200, 250]
default_azimuth_tolerance_deg: 10

zones:
  Z1:
    label: frontal
    azimuth_deg: 0
    azimuth_tolerance_deg: 10
    distance_cm: [200, 250]
    observation_plane: frontal
  Z2:
    label: front_right_oblique
    azimuth_deg: 45
    azimuth_tolerance_deg: 10
    distance_cm: [200, 250]
    observation_plane: frontal_sagittal_mixed
  Z3:
    label: right_sagittal
    azimuth_deg: 90
    azimuth_tolerance_deg: 10
    distance_cm: [200, 250]
    observation_plane: sagittal
  Z4:
    label: rear_right_oblique
    azimuth_deg: 135
    azimuth_tolerance_deg: 10
    distance_cm: [200, 250]
    observation_plane: posterior_sagittal_mixed
  Z5:
    label: rear
    azimuth_deg: 180
    azimuth_tolerance_deg: 10
    distance_cm: [200, 250]
    observation_plane: posterior_frontal
  Z6:
    label: rear_left_oblique
    azimuth_deg: -135
    azimuth_tolerance_deg: 10
    distance_cm: [200, 250]
    observation_plane: posterior_sagittal_mixed
  Z7:
    label: left_sagittal
    azimuth_deg: -90
    azimuth_tolerance_deg: 10
    distance_cm: [200, 250]
    observation_plane: sagittal
  Z8:
    label: front_left_oblique
    azimuth_deg: -45
    azimuth_tolerance_deg: 10
    distance_cm: [200, 250]
    observation_plane: frontal_sagittal_mixed

view_families:
  front:
    label: frontal
    member_zones: [Z1]
    observation_plane: frontal
    mirror_equivalent: false
  front_oblique:
    label: front oblique
    member_zones: [Z2, Z8]
    observation_plane: frontal_sagittal_mixed
    mirror_equivalent: true
  side:
    label: side sagittal
    member_zones: [Z3, Z7]
    observation_plane: sagittal
    mirror_equivalent: true
  rear_oblique:
    label: rear oblique
    member_zones: [Z4, Z6]
    observation_plane: posterior_sagittal_mixed
    mirror_equivalent: true
  rear:
    label: rear
    member_zones: [Z5]
    observation_plane: posterior_frontal
    mirror_equivalent: false

height_levels:
  H1:
    label: floor
    height_cm: [0, 30]
    recommended_for: floor_based_exercises
  H2:
    label: waist
    height_cm: [80, 110]
    recommended_for: lower_body_exercises
  H3:
    label: eye
    height_cm: [140, 170]
    recommended_for: full_body_or_upper_body_exercises

anchor:
  reference_mat:
    approximate_size_cm: [180, 60]
    distance_guidance: full_reference_mat_visible_at_200_to_250_cm
    front_guidance: align_camera_to_front_centerline
    rear_guidance: align_camera_to_rear_centerline
    front_oblique_guidance: align_camera_to_nearest_front_corner
    rear_oblique_guidance: align_camera_to_nearest_rear_corner
    side_guidance: align_camera_parallel_to_long_edge

policy:
  out_of_zone: warn_and_continue
  missing_zone: mark_unknown_and_continue
  missing_anchor: warn_and_continue
  coordinate_correction: none
  coordinate_reprojection: none
