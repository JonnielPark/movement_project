exercise_id: lunge
display_name: Forward Lunge
description: Alternating split-stance lower-body movement; the forward leg loads while
  the rear leg controls hip extension.
version: 0.5.2
tags:
- bodyweight
- lower_body
- closed_chain
- alternating
- strength
classification:
  family: lower_body
  equipment: none
  load_type: bodyweight
  external_load_position: none
  posture_type: standing_split
  kinetic_chain: closed_chain
  laterality: alternating
  movement_pattern: lunge
  primary_plane: sagittal
  secondary_planes:
  - frontal
  complexity: compound
support:
  base_of_support: split_stance
  contact_points:
  - left_foot
  - right_foot
  support_surface: floor
  weight_bearing_regions:
  - left_foot
  - right_foot
phase_model:
  type: resistance_phase
  expected_ratio:
    eccentric: 0.45
    isometric: 0.05
    concentric: 0.5
joint_actions:
  primary:
  - hip_flexion_extension
  - knee_flexion_extension
  - ankle_dorsiflexion_plantarflexion
  secondary:
  - trunk_flexion_extension
  - trunk_lateral_flexion
  - pelvis_lateral_tilt_proxy
  - pelvis_rotation_proxy
  - weight_shift_control
primary_body_regions:
- hip
- knee
- ankle
biomechanical_identity:
  expected_com_motion: vertical_and_anterior_posterior
  stability_requirement: high
  main_load_regions:
  - hip
  - knee
  - ankle
  primary_constraints:
  - maintain_foot_contact
  - maintain_trunk_alignment
  - avoid_knee_valgus
  - avoid_excessive_lateral_shift
  - maintain_pelvis_level
notes: 'Lunge is the primary exercise for validating alternating-pattern motion attribution.

  Forward leg per rep is determined by annotation.starting_side and pattern=alternating.

  Sagittal view is preferred because the rear leg is often occluded in frontal view.

  '
