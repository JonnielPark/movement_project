# Movement Project — Pipeline Configuration
# Step order:
#   ① validation            ② annotation            ③ exercise_definition
#   ④ preprocessing         ⑤ normalization         ⑥ motion_attribution
#   ⑦ features              ⑧ biomech               ⑨ biomarker
#   ⑩ visualization (called outside the runner)
# Toggle each step with enabled: true / false

input:
  path: "data/sample/mediapipe_squat_synthetic.csv"

# ── ① Validation ─────────────────────────────────────────────────────────────
validation:
  enabled: true
  missing_value_threshold: 0.05   # column missing ratio > 5% → warn
  visibility_threshold: 0.5       # landmark visibility quality threshold

# ── ② Annotation ─────────────────────────────────────────────────────────────
annotation:
  enabled: false
  path: "data/sample/mediapipe_squat_synthetic_annotation.csv"

# ── ③ Exercise Definition Loading ────────────────────────────────────────────
exercise_definition:
  enabled: true
  definitions_dir: "data/exercise_definitions"
  # null = derived from annotation exercise_type column; still null → generic fallback
  exercise_id: null

# ── ④ Preprocessing ──────────────────────────────────────────────────────────
preprocessing:
  enabled: false
  reliability:
    visibility_threshold: 0.5
    segment_length_tolerance: 0.25
    joint_angle_check: true
    velocity_threshold_torso_per_sec: 5.0
  swap_detection:
    enabled: true             # auto-disabled for bilateral_symmetric exercises
    temporal_consistency: true
    orientation_prior: true
    orientation_disagree_ratio: 0.4
  interpolation:
    enabled: true
    method: linear
    max_gap_frames: 3         # overridable by exercise definition quality_rules
  smoothing:
    enabled: false
    method: rolling_median
    window_size: 3
  kalman_filter:
    enabled: false            # enable after baseline is characterized
    process_noise: 0.01
    measurement_noise: 0.1

# ── ⑤ Normalization ──────────────────────────────────────────────────────────
normalization:
  enabled: true
  method: hip_torso           # hip center translation + sequence median torso scale
  keep_reference_columns: true  # preserve hip_center, shoulder_center, torso_length columns

# ── ⑥ Motion Attribution ─────────────────────────────────────────────────────
motion_attribution:
  enabled: false
  thresholds:
    active: 0.70              # motion_share > τ_active → unilateral detection
    ambiguous: 0.55           # τ_ambiguous < share ≤ τ_active → ambiguous
    swap: 0.85                # minimum confidence to perform swap in auto_correct mode
  mode: conservative          # conservative | auto_correct

# ── ⑦ Feature Extraction ─────────────────────────────────────────────────────
features:
  enabled: false
  spatial:
    rom: false
    symmetry: false
    shape: false
  temporal:
    tempo: false
    variability: false
  control:
    stability: false
    compensation: false

# ── ⑧ Biomechanical Proxy Modeling ───────────────────────────────────────────
biomech:
  enabled: false
  anthropometric_model: winter_1990   # segment mass ratio reference (Winter 1990)
  include_com_estimation: true
  include_moment_arm: true
  output_unit: torso_length_ratio     # absolute units (N·m, kg) are not used

# ── ⑨ Biomarker Derivation ───────────────────────────────────────────────────
biomarker:
  enabled: false
  emit_provenance: true       # attach source_fields to all biomarkers
  unit: torso_length_ratio

# ── Output ────────────────────────────────────────────────────────────────────
output:
  save_processed: false
  processed_path: "data/processed/normalized.csv"
  save_report: false
  report_path: "data/processed/report.json"

# ── (External) Robustness Simulation ─────────────────────────────────────────
# Called separately via the simulation/ package, outside pipeline steps ①–⑨.
simulation:
  enabled: false
  rom_restriction:
    enabled: false
    target_joint: knee
    restriction_levels_deg: [10, 20, 30]
  visual_noise:
    enabled: false
    sigma_torso_ratio: [0.005, 0.01, 0.02]
  occlusion:
    enabled: false
    target_landmarks: [left_ankle, right_ankle]
    duration_frames: [5, 15, 30]
