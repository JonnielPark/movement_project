# Movement Project — Pipeline Configuration
# Step order:
#   ①  validation           ②  annotation          ③  exercise_definition
#   ④  preprocessing        ⑤  normalization        ⑥  canonicalization
#   ⑦  segmentation         ⑧  features (includes side-role context)
#   ⑨  biomech              ⑩  biomarker
#   ⑪  visualization        (called outside the runner)
#   ⑫  simulation           (called outside the runner, scripts/run_robustness_experiment.py)
# Toggle each step with enabled: true / false

input:
  path: "data/pose/sample/mediapipe_squat_synthetic.csv"

# ── ① Validation ─────────────────────────────────────────────────────────────
validation:
  enabled: true
  missing_value_threshold: 0.05   # column missing ratio > 5% → warn
  visibility_threshold: 0.5       # landmark visibility quality threshold

# ── ② Annotation ─────────────────────────────────────────────────────────────
annotation:
  enabled: false
  path: "data/pose/sample/mediapipe_squat_synthetic_annotation.csv"

# ── ③ Exercise Definition Loading ────────────────────────────────────────────
exercise_definition:
  enabled: true
  definitions_dir: "data/definitions/exercises"
  # null = derived from annotation exercise_id column; still null → generic fallback
  exercise_id: null

# ── ④ Preprocessing ──────────────────────────────────────────────────────────
preprocessing:
  enabled: false
  reliability:
    visibility_threshold: 0.5
    segment_length_tolerance: 0.25
    joint_angle_check: true
    velocity_threshold_torso_per_sec: 5.0
  swap_detection:
    enabled: true             # auto-disabled for bilateral_symmetric exercises
    temporal_consistency: true
    orientation_prior: true
    orientation_disagree_ratio: 0.4
  interpolation:
    enabled: true
    method: linear
    max_gap_frames: 3         # overridable by exercise definition quality_rules
    post_velocity_check: true # re-check interpolated landmark-frame jumps
  smoothing:
    enabled: false
    method: rolling_median
    window_size: 3
  far_side_stabilization:
    enabled: false
    camera_side_inference: true
    visibility_threshold: 0.6
    jitter_threshold_torso_per_sec: null        # null = conservative 3x reliability velocity threshold
    acceleration_threshold_torso_per_sec2: null # null = jitter threshold scaled by fps
    max_gap_frames: 3
    smoothing_method: rolling_median
    smoothing_window_size: 3
    mark_long_gaps_low_confidence: true
    depth_axis: z
    near_depth_sign: negative
    min_depth_offset_torso: 0.05

# ── ⑤ Normalization ──────────────────────────────────────────────────────────
normalization:
  enabled: true
  method: hip_torso           # hip center translation + sequence median torso scale
  keep_reference_columns: true  # preserve hip_center, shoulder_center, torso_length columns
  model_depth_scale: 1.0        # z residual gain before torso scaling; 1.0 preserves legacy behavior

# ── ⑥ Canonicalization ───────────────────────────────────────────────────────
# Disabled by default. Creates separate candidate coordinate columns and reports
# when enabled; downstream stages still use norm coordinates unless explicitly
# promoted after notebook/robustness review.
canonicalization:
  enabled: false
  coordinate_mode: norm
  output_prefix: canon
  report_only: true
  downstream_coordinate_mode: norm
  corrected_3d_hypothesis:
    enabled: false
    output_family: corrected_3d_hypothesis
    downstream_coordinate_mode: norm
    emit_sensitivity_report: true
    support_pair: [left_ankle, right_ankle]
    report_burden_before_feature_use: true
    require_feature_domain_declaration: true
  data_confidence:
    emit: true
    correction_magnitude_warn_torso: 0.15
    correction_magnitude_fail_torso: 0.30
    residual_warn_torso: 0.08
  support_plane_alignment:
    enabled: false
    method: support_plane_alignment
    vertical_axis: y
    support_landmarks: [left_heel, right_heel, left_foot_index, right_foot_index]
    diagnostic_landmarks: [left_heel, right_heel, left_foot_index, right_foot_index]
    visibility_threshold: 0.7
    stability_window_frames: 5
    max_anchor_residual_torso: 0.08
    correction_transform: rigid_rotation  # rigid_rotation | vertical_shear
    camera_pitch_deg: 0.0
    camera_roll_deg: 0.0
    correction_strength: 1.0
    max_correction_torso: 0.25
  movement_plane_alignment:
    enabled: false
    method: principal_motion_plane
    fit_landmarks: [left_hip, left_knee, left_ankle, right_hip, right_knee, right_ankle]
    minimum_visible_landmark_ratio: 0.7
    correction_strength: 0.5
    max_rotation_deg: 20.0
    preserve_out_of_plane_residual: true
  protocol_height_lateral_width_alignment:
    enabled: false
    method: height_anchor_lateral_width
    observed_height_level: null
    observed_height_column: camera_height_level
    recommended_height_level: null
    require_height_match: true
    height_anchor_map:
      H1: [left_ankle, right_ankle]
      H2: [left_hip, right_hip]
      H3: [left_shoulder, right_shoulder]
    near_depth_sign: negative
    correction_mode: near_side_attenuation
    correction_strength: 0.3
    max_scale_change: 0.20
    max_correction_torso: 0.15
    min_depth_offset_torso: 0.05
    visibility_threshold: 0.6
    apply_to_landmarks: []
    preserve_anchor_landmarks: true
  # Backward-compatible legacy key. New development should prefer
  # support_plane_alignment.
  floor_relative_correction:
    enabled: false
    method: support_plane_alignment
    coordinate_mode: norm
    vertical_axis: y
    support_landmarks: [left_heel, right_heel, left_foot_index, right_foot_index]
    diagnostic_landmarks: [left_heel, right_heel, left_foot_index, right_foot_index]
    visibility_threshold: 0.7
    stability_window_frames: 5
    max_anchor_residual_torso: 0.08
    correction_transform: rigid_rotation  # rigid_rotation | vertical_shear
    # Level-camera target by default. These values define the target
    # pose-coordinate pseudo-floor slope to preserve, not calibrated camera
    # extrinsics or perspective reprojection.
    camera_pitch_deg: 0.0
    camera_roll_deg: 0.0
    correction_strength: 1.0
    max_correction_torso: 0.25

# ── ⑦ Rep Segmentation ───────────────────────────────────────────────────────
# Estimates rep boundaries from joint-motion tracking and fills `rep_id`.
# Auto-skips when the exercise definition has no `rep_segmentation` block.
rep_segmentation:
  enabled: false              # set to true when rep_id is not supplied by annotation
  fps_default: 30.0           # used when df.attrs["fps"] is absent

# ── ⑦ Phase Segmentation ─────────────────────────────────────────────────────
# Inserts kinematic phase labels (e.g., Descent / Ascent) into the `phase` column
# for each confirmed rep. Auto-skips when the exercise definition has no
# `phase_segmentation` block (e.g., generic.yaml) or when no rep frames are present.
phase_segmentation:
  enabled: false              # set to true after annotation is enabled
  fps_default: 30.0           # used when df.attrs["fps"] is absent
  multi_inflection_policy: global_extremum   # global_extremum | first | reject_rep
  minimum_rep_length_frames: 8

# ── ⑧ Feature Extraction ─────────────────────────────────────────────────────
# extract_rep_features() runs all spatial / temporal / control features.
# When phase_segmentation is enabled and the phase column is populated,
# features in PHASE_AWARE_FEATURE_FAMILIES are also emitted per (rep_id, phase).
features:
  enabled: false
  role_context:
    enabled: false
    thresholds:
      active: 0.70            # motion_share > τ_active → active-side evidence
      ambiguous: 0.55         # τ_ambiguous < share ≤ τ_active → ambiguous
      swap: 0.85              # legacy auto_correct threshold; no coordinate changes
    mode: conservative        # conservative | auto_correct
  spatial:
    range_of_motion: true
    movement_path: true
    support_consistency: true
    role_alignment: true
    phase_profile: true
  temporal:   {tempo: true, variability: true}
  control:    {stability: true, compensation: true}
  compensation:
    enabled: true
    registry: COMPENSATION_RULES   # dispatched via features/compensation.py

# ── ⑨ Biomechanical Proxy Modeling ───────────────────────────────────────────
biomech:
  enabled: false
  anthropometric_model: winter_1990   # segment mass ratio reference (Winter 1990)
  include_com_estimation: true
  include_moment_arm: true
  output_unit: torso_length_ratio     # absolute units (N·m, kg) are not used
  use_visibility_weight: true
  minimum_visible_landmark_ratio: 0.6

# ── ⑩ Biomarker Derivation ───────────────────────────────────────────────────
biomarker:
  enabled: false
  emit_provenance: true       # attach source_fields to all biomarkers
  unit: torso_length_ratio
  # Default preserves 0-100 scoring. If changed, Z-score deductions and the
  # dynamic floor are linearly scaled to this output range.
  score_bounds:
    min: 0.0
    max: 100.0
  # Relative units are normalized at runtime. Equal defaults keep the current
  # validation pass neutral; adjust later for exercise-specific scoring studies.
  domain_weights:
    spatial: 1.0
    temporal: 1.0
    control: 1.0
    biomech: 1.0
  # Within-domain feature-family budgets. Configured domains do not redistribute
  # a missing/withheld family budget to remaining families.
  domain_feature_family_weights:
    spatial:
      range_of_motion: 0.60
      movement_path: 0.15
      support_consistency: 0.05
      role_alignment: 0.15
      phase_profile: 0.05
    temporal:
      tempo: 0.25
      variability: 0.50
      phase_profile: 0.25
  # Exercise-definition scoring intent. Focus gravity is multiplied with
  # availability/depth/feature override gravity; it does not replace those gates.
  scoring_focus_weights:
    primary: 1.0
    secondary: 0.45
    context_constraint: 0.6
    compensation: 0.5
    diagnostic: 0.0
  # Scoring-stage gravity for low-confidence records. This keeps monocular
  # biomech/depth evidence visible without treating it as full-strength evidence.
  low_confidence_score_weights:
    spatial: 0.0
    temporal: 0.0
    control: 0.0
    biomech: 0.1
  # Evidence gravity by depth-dependency class. Features remain visible in
  # biomarkers/deduction audit; this only controls score contribution strength.
  depth_dependency_score_weights:
    none: 1.0
    low: 1.0
    moderate: 0.5
    high: 0.1
    unknown: 0.3
  # Feature-id gravity overrides for evidence that should remain visible but
  # currently has weak direct movement-quality interpretation under monocular
  # pose. Fixed closed-chain ankle support-landmark path is withheld from scoring;
  # support-consistency scoring should use a separate recording-view feature family.
  feature_score_weight_overrides:
    spatial.movement_path.arc_length_xy.left_ankle.*: 0.0
    spatial.movement_path.arc_length_xy.right_ankle.*: 0.0
    spatial.movement_path.arc_length_xyz.left_ankle.*: 0.0
    spatial.movement_path.arc_length_xyz.right_ankle.*: 0.0
    spatial.movement_path.arc_length_xyz.left_knee.*: 0.0
    spatial.movement_path.arc_length_xyz.right_knee.*: 0.0
    spatial.range_of_motion.xyz.*: 0.25
    control.compensation.knee_valgus.xy.*: 0.25
    control.compensation.knee_varus.xy.*: 0.25
    control.compensation.excessive_trunk_flexion.xy: 0.5
    control.compensation.excessive_trunk_flexion.xyz: 0.25
    spatial.range_of_motion.xy.left_hip_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xy.right_hip_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xy.left_knee_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xy.right_knee_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xy.left_ankle_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xy.right_ankle_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xyz.left_hip_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xyz.right_hip_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xyz.left_knee_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xyz.right_knee_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xyz.left_ankle_angle.turnaround_hold: 0.0
    spatial.range_of_motion.xyz.right_ankle_angle.turnaround_hold: 0.0
  # Directional baseline matching. Stable bottom-position lower-body path can
  # be lower than the provisional baseline without representing a movement fault.
  feature_score_direction_overrides:
    spatial.support_consistency.*: upper_bound_only
    spatial.role_alignment.left_right.support_consistency_xy_drift.*: upper_bound_only
    spatial.movement_path.arc_length_xy.left_hip.turnaround_hold: upper_bound_only
    spatial.movement_path.arc_length_xy.right_hip.turnaround_hold: upper_bound_only
    spatial.movement_path.arc_length_xy.left_knee.turnaround_hold: upper_bound_only
    spatial.movement_path.arc_length_xy.right_knee.turnaround_hold: upper_bound_only
  # Baseline generation is a ⑩ scoring sub-policy. The default current-run mode
  # opens the score path for provisional inspection only; reviewed/reference
  # baselines still require user-supplied reference recordings or custom bands.
  baseline_generation:
    enabled: true
    generate_when_missing: true
    source_mode: current_run
    baseline_status: provisional
    source_type: current_recording
    pose_backend: mediapipe
    coordinate_mode: norm
    output_dir: data/reference/baselines
    active_metrics_path: data/reference/baseline_zscore.json
    qc_output_dir: data/reference/baseline_qc
    mirror_active_metrics: false
    use_generated_for_current_scoring: true

# ── Output ────────────────────────────────────────────────────────────────────
output:
  save_processed: false
  processed_path: "data/processed/normalized.csv"
  save_report: false
  report_path: "data/processed/report.json"

# ── ⑫ Robustness Simulation ──────────────────────────────────────────────────
# Called separately via scripts/run_robustness_experiment.py, outside ①–⑩.
# Mirrors the documented robustness condition matrix.
simulation:
  enabled: false
  viewpoint_variation:
    enabled: false
    deviations_deg: [-30, -15, 15, 30]
  rom_restriction:
    enabled: false
    target_joint: knee
    levels_deg: [30, 60, 90]
  visual_noise:
    enabled: false
    sigma_torso_ratio: [0.005, 0.01, 0.02]
  occlusion:
    enabled: false
    target_landmarks: [left_ankle, right_ankle]
    duration_frames: [5, 15, 30]
  velocity_spike:
    enabled: false
    magnitude_torso_ratio: [0.2, 0.5, 1.0]
