[project]
name = "movement-project"
version = "0.1.0"
description = "Interpretable movement quality analysis framework"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "scipy",
    "matplotlib",
    "jupyter",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]