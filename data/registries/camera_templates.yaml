version: 0.1.0
templates:
  front_oblique_lower_body:
    camera_protocol:
      recommended_zones: [Z2, Z8]
      recommended_height: H2
      anchor: reference_mat
      distance_cm: [200, 250]
      primary_observation_purpose: [knee_valgus, hip_flexion_depth]
      out_of_zone_policy: warn_and_continue
      coordinate_correction: none
    view_metric_reliability:
      structure: bilateral_symmetric
      zones:
        Z1: {bilateral_symmetry: high, frontal_alignment: high, sagittal_rom: low, depth: low, trunk_flexion: low, heel_lift: low}
        Z2: {bilateral_symmetry: moderate, frontal_alignment: high, sagittal_rom: moderate, depth: moderate, trunk_flexion: moderate, heel_lift: moderate}
        Z3: {sagittal_rom: high, depth: high, trunk_flexion: high, heel_lift: moderate, bilateral_symmetry: low, frontal_alignment: low}
        Z7: {sagittal_rom: high, depth: high, trunk_flexion: high, heel_lift: moderate, bilateral_symmetry: low, frontal_alignment: low}
        Z8: {bilateral_symmetry: moderate, frontal_alignment: high, sagittal_rom: moderate, depth: moderate, trunk_flexion: moderate, heel_lift: moderate}

  side_lower_body:
    camera_protocol:
      recommended_zones: [Z3, Z7]
      recommended_height: H2
      anchor: reference_mat
      distance_cm: [200, 250]
      primary_observation_purpose: [anterior_knee_travel, sagittal_alignment, trunk_spine_neutrality]
      out_of_zone_policy: warn_and_continue
      coordinate_correction: none
    view_metric_reliability:
      structure: unilateral_or_alternating
      role_labels: [forward_leg, trailing_leg, active_side, support_side]
      zones:
        Z1: {side_order: high, step_width: high, frontal_alignment: high, pelvis_drop_or_shift: high, side_to_side_comparison: moderate, forward_limb_sagittal_rom: low, rear_limb_extension: low, anterior_knee_travel: low, trunk_flexion: low}
        Z3: {forward_limb_sagittal_rom: high, rear_limb_extension: high, anterior_knee_travel: high, trunk_flexion: high, step_length: high, frontal_alignment: low, pelvis_drop_or_shift: low, side_to_side_comparison: low}
        Z7: {forward_limb_sagittal_rom: high, rear_limb_extension: high, anterior_knee_travel: high, trunk_flexion: high, step_length: high, frontal_alignment: low, pelvis_drop_or_shift: low, side_to_side_comparison: low}

  side_floor_upper_body:
    camera_protocol:
      recommended_zones: [Z3, Z7]
      recommended_height: H1
      anchor: reference_mat
      distance_cm: [200, 250]
      primary_observation_purpose: [shoulder_angle, hip_hinge_geometry]
      out_of_zone_policy: warn_and_continue
      coordinate_correction: none
    view_metric_reliability:
      structure: bilateral_symmetric
      zones:
        Z2: {upper_limb_symmetry: moderate, frontal_alignment: moderate, sagittal_rom: moderate, depth: moderate, hip_position: moderate}
        Z3: {sagittal_rom: high, depth: high, hip_position: high, trunk_hip_alignment: high, upper_limb_symmetry: low, frontal_alignment: low}
        Z7: {sagittal_rom: high, depth: high, hip_position: high, trunk_hip_alignment: high, upper_limb_symmetry: low, frontal_alignment: low}
        Z8: {upper_limb_symmetry: moderate, frontal_alignment: moderate, sagittal_rom: moderate, depth: moderate, hip_position: moderate}

  front_oblique_floor_core:
    camera_protocol:
      recommended_zones: [Z2, Z8]
      recommended_height: H1
      anchor: reference_mat
      distance_cm: [200, 250]
      primary_observation_purpose: [pelvic_rotation, weight_shift_control, lateral_sway]
      out_of_zone_policy: warn_and_continue
      coordinate_correction: none
    view_metric_reliability:
      structure: unilateral_or_alternating
      role_labels: [active_side, support_side]
      zones:
        Z1: {side_order: high, lateral_shift: high, active_hand_trajectory: moderate, pelvis_rotation: low, true_tap_contact: low, hip_height: low}
        Z2: {side_order: high, lateral_shift: high, pelvis_rotation: high, active_hand_trajectory: high, support_shoulder_alignment: moderate, true_tap_contact: low, hip_height: moderate}
        Z3: {hip_height: high, trunk_sagittal_alignment: high, active_hand_trajectory: low, side_order: low, lateral_shift: low, pelvis_rotation: low}
        Z8: {side_order: high, lateral_shift: high, pelvis_rotation: high, active_hand_trajectory: high, support_shoulder_alignment: moderate, true_tap_contact: low, hip_height: moderate}

