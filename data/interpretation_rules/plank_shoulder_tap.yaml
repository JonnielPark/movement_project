# data/interpretation_rules/plank_shoulder_tap.yaml
#
# Interpretation rules for the Plank Shoulder Tap exercise.
# Consumed by biomarker.interpretation.derive_interpretations().
# ---

exercise_id: plank_shoulder_tap

rules:

  - id: dominant_control_plank
    when:
      dominant_deduction_domain: control
    label: >
      Anti-rotation control is the primary quality concern — expected in this
      task. Review pelvic rotation and lateral pelvic shift metrics across reps.

  - id: floor_hit_spatial
    when:
      floor_applied.spatial: true
    label: >
      Plank posture ROM threshold not achieved — floor correction applied to
      the spatial domain score. Review shoulder and hip alignment across phases.

  - id: low_control_score
    when:
      domain_score.control: { lt: 75 }
    label: >
      Substantial pelvic or trunk instability detected during the tap task.
      Review lateral CoM shift and pelvic rotation metrics for the flagged reps.

  - id: floor_hit_control
    when:
      floor_applied.control: true
    label: >
      Control deductions exceeded the dynamic floor threshold. Anti-rotation
      demand may be high relative to the ROM maintained in the plank posture.

  - id: low_temporal_score
    when:
      domain_score.temporal: { lt: 80 }
    label: >
      Tap rhythm inconsistency detected — review phase-duration variability
      across alternating reps to assess movement control under timing pressure.

  - id: low_overall_score
    when:
      final_score: { lt: 75 }
    label: >
      Overall movement quality score below 75 in plank shoulder tap. Review
      pelvic stability, trunk anti-rotation control, and tap-cycle rhythm together.
