segmentation:
  resistance_vertical_hip:
    rep_segmentation:
      reference_landmark: hip_center
      reference_coordinate_family: recording_view_raw
      reference_axis: image_y
      boundary_logic: local_minimum
      smoothing:
        method: savitzky_golay
        window_frames: 7
        polyorder: 3
      minimum_rep_length_frames: 8
      minimum_boundary_distance_frames: 8
      minimum_reps: 1
      boundary_prominence: null
      include_endpoints: true
    phase_segmentation:
      reference_landmark: hip_center
      reference_coordinate_family: recording_view_raw
      reference_axis: image_y
      phase_sequence:
      - Descent
      - Ascent
      split_logic: local_maximum
      smoothing:
        method: savitzky_golay
        window_frames: 7
        polyorder: 3
      turnaround_hold:
        enabled: true
        half_window_frames: 3
      minimum_rep_length_frames: 8
      multi_inflection_policy: global_extremum

  resistance_vertical_nose:
    rep_segmentation:
      reference_landmark: nose
      reference_axis: vertical
      boundary_logic: local_maximum
      smoothing:
        method: savitzky_golay
        window_frames: 7
        polyorder: 3
      minimum_rep_length_frames: 8
      minimum_boundary_distance_frames: 8
      minimum_reps: 1
      boundary_prominence: null
      include_endpoints: true
    phase_segmentation:
      reference_landmark: nose
      reference_axis: vertical
      phase_sequence:
      - Descent
      - Ascent
      split_logic: local_minimum
      smoothing:
        method: savitzky_golay
        window_frames: 7
        polyorder: 3
      turnaround_hold:
        enabled: true
        half_window_frames: 3
      minimum_rep_length_frames: 8
      multi_inflection_policy: global_extremum

  task_vertical_right_wrist_tap:
    rep_segmentation:
      reference_landmark: right_wrist
      reference_axis: vertical
      boundary_logic: local_minimum
      smoothing:
        method: savitzky_golay
        window_frames: 5
        polyorder: 3
      minimum_rep_length_frames: 6
      minimum_boundary_distance_frames: 6
      minimum_reps: 1
      boundary_prominence: null
      include_endpoints: true
    phase_segmentation:
      reference_landmark: right_wrist
      reference_axis: vertical
      phase_sequence:
      - Lift
      - Tap
      - Return
      split_logic:
      - local_maximum
      - local_minimum
      smoothing:
        method: savitzky_golay
        window_frames: 5
        polyorder: 3
      turnaround_hold:
        enabled: false
        half_window_frames: 2
      minimum_rep_length_frames: 6
      multi_inflection_policy: global_extremum

