exercise_id: squat
display_name: Bodyweight Squat
description: Bilateral lower-body closed-chain movement emphasizing hip, knee, and
  ankle coordination.
version: 0.5.2
tags:
- bodyweight
- lower_body
- closed_chain
- bilateral
- strength
classification:
  family: lower_body
  equipment: none
  load_type: bodyweight
  external_load_position: none
  posture_type: standing
  kinetic_chain: closed_chain
  laterality: bilateral_symmetric
  movement_pattern: squat
  primary_plane: sagittal
  secondary_planes:
  - frontal
  - transverse
  complexity: compound
support:
  base_of_support: bilateral_feet
  contact_points:
  - left_foot
  - right_foot
  support_surface: floor
  weight_bearing_regions:
  - left_foot
  - right_foot
phase_model:
  type: resistance_phase
  expected_ratio:
    eccentric: 0.4
    isometric: 0.1
    concentric: 0.5
joint_actions:
  primary:
  - hip_flexion_extension
  - knee_flexion_extension
  - ankle_dorsiflexion_plantarflexion
  secondary:
  - trunk_flexion_extension
  - pelvis_lateral_tilt_proxy
  - pelvis_rotation_proxy
primary_body_regions:
- hip
- knee
- ankle
biomechanical_identity:
  expected_com_motion: vertical
  stability_requirement: medium
  main_load_regions:
  - hip
  - knee
  - ankle
  primary_constraints:
  - maintain_foot_contact
  - maintain_trunk_alignment
  - avoid_knee_valgus
  - avoid_heel_lift
  - avoid_excessive_lateral_shift
notes: Squat is a suitable reference exercise for validating bilateral symmetry, sagittal-plane
  ROM, COM displacement, and lower-limb compensation indicators.
