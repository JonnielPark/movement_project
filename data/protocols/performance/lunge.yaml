exercise_id: lunge
version: 0.5.2
performance_protocol:
  prescription:
    target_sets: 3
    target_count_per_set: 10
    count_unit: repetition
    segmentation_reps_per_count: 1
    rest_between_sets_s:
    - 120
    - 180
  counting:
    target_count: 10
    count_unit: repetition
    segmentation_reps_per_count: 1
  side_sequence:
    mode: same_side_block_then_switch
    block_size_counts: 5
    first_side_source: annotation.starting_side
  allowed_side_sequence_modes:
  - same_side_block_then_switch
  - alternating_each_rep
  completion:
    allow_partial_completion: false
    recommended_sets: 3
  participant_cues:
  - keep_hands_on_pelvis
  - avoid_arm_swing
  - keep_trunk_upright
  analysis_disrupting_patterns:
  - inconsistent_step_length
  - arm_swing
  - excessive_trunk_flexion
  - camera_side_change
  - unstable_foot_contact
